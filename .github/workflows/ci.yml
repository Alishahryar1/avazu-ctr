name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Install CPU development environment
        run: uv sync --frozen --extra cpu --group dev --group kaggle
      - name: Kaggle CLI smoke test
        run: uv run --frozen --extra cpu --group kaggle kaggle --version
      - name: Format
        run: uv run --frozen --extra cpu --group kaggle ruff format --check .
      - name: Lint
        run: uv run --frozen --extra cpu --group kaggle ruff check .
      - name: Type check
        run: uv run --frozen --extra cpu --group kaggle ty check
      - name: Test
        run: uv run --frozen --extra cpu --group kaggle pytest
      - name: Audit dependencies
        run: uv run --frozen --extra cpu --group kaggle pip-audit
      - name: Build package
        run: uv build
      - name: CLI smoke test
        run: uv run --frozen --extra cpu --group kaggle avazu-ctr --help

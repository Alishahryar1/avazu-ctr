schema_version: 2
name: senet-dcnv2-staged-tuning

data:
  train_path: data/raw/train.gz
  test_path: data/raw/test.gz
  artifact_root: artifacts
  shard_rows: 1000000
  vocabulary_limit: 1000000
  minimum_frequency: 2
  target_encoding:
    enabled: true
    columns: [site_id, app_id]
    blocks: 5
    smoothing: 20.0
    neutral_prior: 0.5

model:
  kind: multihead
  default_embedding: {kind: standard, dim: 16}
  feature_embeddings:
    device_id: {kind: hash, dim: 24, buckets: 100000, hashes: 2}
    device_ip: {kind: hash, dim: 24, buckets: 200000, hashes: 2}
  backbone:
    senet: {enabled: true, reduction_ratio: 3, activation: gelu}
    dcn_layers: 4
    dcn_rank: 32
    mlp_hidden: [256, 128]
    activation: gelu
    dropout: 0.1
    layer_norm: true
  heads:
    - {hidden: [128], dropout: 0.25}
    - {hidden: [64], dropout: 0.2}
    - {hidden: [32], dropout: 0.15}
  aggregation: gated
  feature_bagging: 0.8

training:
  seed: 42
  epochs: 5
  batch_size: 4096
  device: auto
  amp: true
  early_stopping_patience: 2
  optimizer:
    dense:
      kind: adamw
      learning_rate: 0.001
      weight_decay: 0.00001

tuning:
  enabled: true
  study_name: avazu-ctr
  trials_per_stage: 30
  confirmation_candidates: 5

tracking:
  database: artifacts/experiments.sqlite3
  tensorboard_dir: artifacts/tensorboard
  champion_dir: artifacts/champion
  tensorboard: true

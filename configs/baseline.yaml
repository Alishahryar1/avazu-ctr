schema_version: 5
name: dcnv2-baseline

data:
  train_path: data/raw/train.gz
  test_path: data/raw/test.gz
  artifact_root: artifacts
  shard_rows: 250000
  vocabulary_limit: 1000000
  minimum_frequency: 2
  features:
    mode: competition_transductive
    crosses:
      - {name: user_proxy, columns: [device_ip, device_model]}
      - {name: device_id_x_app_id, columns: [device_id, app_id]}
      - {name: device_ip_x_C14, columns: [device_ip, C14]}
      - {name: user_proxy_x_app_id, columns: [user_proxy, app_id]}
      - {name: user_proxy_x_site_id, columns: [user_proxy, site_id]}
      - {name: site_id_x_C14, columns: [site_id, C14]}
      - {name: app_id_x_C14, columns: [app_id, C14]}
    frequency_columns: [device_ip, device_id, user_proxy, app_id, site_id, C14, C17, C21]
    distinct_counts:
      - {name: device_ip_distinct_apps_log1p, group_by: device_ip, value: app_id}
      - {name: device_ip_distinct_sites_log1p, group_by: device_ip, value: site_id}
      - {name: user_proxy_distinct_apps_log1p, group_by: user_proxy, value: app_id}
      - {name: user_proxy_distinct_sites_log1p, group_by: user_proxy, value: site_id}
    history:
      - {key: user_proxy, within_hour: true}
      - {key: device_ip, within_hour: false}
    target_encoding:
      columns: [app_id, site_id, site_domain, app_domain, C14, C17]
      blocks: 10
      smoothing: 20.0
      probability_clip: 0.00001

model:
  kind: dcn
  default_embedding:
    kind: standard
    dim: 16
  feature_embeddings:
    site_id: {kind: hash, dim: 16, buckets: 100000, hashes: 2}
    app_id: {kind: hash, dim: 16, buckets: 100000, hashes: 2}
    device_id: {kind: hash, dim: 16, buckets: 100000, hashes: 2}
    device_ip: {kind: hash, dim: 16, buckets: 200000, hashes: 2}
    C14: {kind: hash, dim: 16, buckets: 50000, hashes: 2}
    C17: {kind: hash, dim: 16, buckets: 20000, hashes: 2}
    C21: {kind: hash, dim: 16, buckets: 10000, hashes: 2}
    hour_of_day: {kind: hash, dim: 16, buckets: 64, hashes: 1}
    day_of_week: {kind: hash, dim: 16, buckets: 64, hashes: 1}
    day_of_month: {kind: hash, dim: 16, buckets: 64, hashes: 1}
    hour_of_week: {kind: hash, dim: 16, buckets: 256, hashes: 1}
    user_proxy: {kind: hash, dim: 16, buckets: 200000, hashes: 2}
    device_id_x_app_id: {kind: hash, dim: 16, buckets: 200000, hashes: 2}
    device_ip_x_C14: {kind: hash, dim: 16, buckets: 300000, hashes: 2}
    user_proxy_x_app_id: {kind: hash, dim: 16, buckets: 200000, hashes: 2}
    user_proxy_x_site_id: {kind: hash, dim: 16, buckets: 200000, hashes: 2}
    site_id_x_C14: {kind: hash, dim: 16, buckets: 150000, hashes: 2}
    app_id_x_C14: {kind: hash, dim: 16, buckets: 150000, hashes: 2}
  dcn:
    backbone:
      senet: {enabled: false}
      dcn_layers: 4
      dcn_rank: 32
      mlp_hidden: [256, 128]
      activation: gelu
      dropout: 0.1
      layer_norm: true
    heads:
      - {hidden: [], dropout: 0.0}
    aggregation: mean
    feature_bagging: 1.0

objective:
  aggregate_weight: 1.0
  auxiliary_weight: 0.0
  diversity_weight: 0.0
  child_weight: 0.0

training:
  seed: 42
  epochs: 1
  batch_size: 4096
  num_workers: 0
  device: auto
  amp: true
  amp_dtype: float16
  compile_model: false
  deterministic_algorithms: false
  gradient_clip: 5.0
  early_stopping_patience: 0
  log_every_steps: 50
  optimizer:
    dense:
      kind: adamw
      learning_rate: 0.001
      weight_decay: 0.00001
      scheduler:
        kind: cosine
        warmup_ratio: 0.05
        minimum_lr_ratio: 0.01

tracking:
  database: artifacts/experiments.sqlite3
  tensorboard_dir: artifacts/tensorboard
  selection_dir: artifacts/selection
  tensorboard: true

deployment:
  champion_dir: artifacts/champion
  max_weight_bytes: 536870912
